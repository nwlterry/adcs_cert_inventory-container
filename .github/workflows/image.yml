name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t ca-ledger:0.3.0-beta.1 .
      - name: Save air-gap archive
        run: docker save ca-ledger:0.3.0-beta.1 | gzip -1 > ca-ledger-container.tar.gz
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ca-ledger-container
          path: ca-ledger-container.tar.gz
          if-no-files-found: error
      - name: Attach archive to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5 6; do
            gh release view "$tag" && break
            sleep 5
          done
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --title "$tag" --notes-file RELEASE.md
          fi
          gh release upload "$tag" ca-ledger-container.tar.gz --clobber
